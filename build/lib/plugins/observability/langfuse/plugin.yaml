name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Eden OE — traces conversations, LLM calls, and tool usage. Opt-in via `eden plugins enable observability/langfuse` or `eden tools → Langfuse Observability`."
author: ProjectGlacie
requires_env:
  - EDEN_OE_LANGFUSE_PUBLIC_KEY
  - EDEN_OE_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
